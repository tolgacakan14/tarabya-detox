name: Hatırlatıcılar
# GitHub's own cron is unreliable for small repos (runs can be hours late), so this job stays alive for
# ~5h45m, asks the app every 5 minutes whether a reminder is due, then restarts itself.
# The endpoint is throttled and only sends what is due (max 2 reminders a day, never at night).
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Her 5 dakikada bir kontrol
        run: |
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -fsS --max-time 60 https://ikimiz-app.vercel.app/api/push/tick || true
            echo
            sleep 300
          done
      - name: Kendini yeniden başlat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reminders.yml --repo ${{ github.repository }} || true
